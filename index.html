<!doctype html>
<html lang="ko" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate">
<meta name="robots" content="noindex">
<title>Econ Play 마을</title>
<style>
  :root { --bg:#f6f1e7; --card:#fff; --ink:#3b2a1a; --sub:#7a6a58; --accent:#2458b5; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); color:var(--ink); font-family:system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; padding:16px; }
  .card { background:var(--card); border-radius:20px; padding:32px 24px; max-width:420px; width:100%;
          text-align:center; box-shadow:0 6px 24px rgba(59,42,26,.12); }
  .ico { font-size:56px; line-height:1; }
  h1 { margin:16px 0 8px; font-size:26px; }
  p { margin:6px 0; color:var(--sub); font-size:16px; line-height:1.6; }
  a { display:inline-block; margin-top:20px; padding:12px 20px; border-radius:12px;
      background:var(--accent); color:#fff; text-decoration:none; font-weight:700; }
</style>
</head>
<body>
  <div class="card">
    <div class="ico">🏘️</div>
    <h1>Econ Play 마을</h1>
    <p>새로운 마을을 짓고 있어요.</p>
    <p>조금만 기다려 주세요!</p>
    <a href="https://bgy125-creator.github.io/">지금 Econ Play로 가기</a>
  </div>
</body>
</html>
